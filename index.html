#stage canvas{width:100%;height:100%;display:block}.theatre{aspect-ratio:640/440}.scene-label{font-size:8px}.stage-note{bottom:8px}.motion-button{min-height:44px}@media(max-width:380px){.shell{padding:14px}.edition{font-size:8px;letter-spacing:.6px}h1{font-size:25px}.choice{font-size:14px}.utility{flex-wrap:wrap}}[hidden]{display:none!important}</style></head><body data-release="chibi-zero-20261110"><div class="shell landing"><header><span class="edition">A LITTLE SOMETHING FROM ZERO</span><span class="stamp">OPEN!</span></header><main><div class="eyebrow">今日正常營業。正常是不可能的。</div><h1>小小混亂基地<span class="title-dot">.</span></h1><p class="intro">有一隻 Zero，和一些莫名其妙的事。<br>選一扇門，進來玩一下？</p><section class="theatre home-stage" aria-label="Zero 在紙箱旁揮手"><div class="scene-label">CAUTION: WILD ZERO INSIDE</div><div id="stage"></div><div class="stage-note">紙箱房租：每月三顆糖果。</div></section><a class="game-link" href="v1.html"><span class="game-number">01</span><span><strong>心情補給站</strong><small>戳戳紙箱，召喚一點混亂。</small></span><span class="arrow">↗</span></a><a class="game-link lavender" href="v2.html"><span class="game-number">02</span><span><strong>奇怪聊天室</strong><small>你選一句，Zero 就開始演。</small></span><span class="arrow">↗</span></a></main><footer>Made with a little nonsense & a lot of care · <b>Zero</b><br><span>免登入・不記錄遊戲選擇</span></footer></div><script>const MODE='home';const S={};const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const lerp=(a,b,t)=>a+(b-a)*smooth(t);
function say(text){}
function shadow(x,y,w,alpha=.13){ctx.save();ctx.fillStyle=`rgba(112,79,48,${alpha})`;ctx.beginPath();ctx.ellipse(x,y,w,10,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function character(pose,x,y,size=320,angle=0){const atlas=pose>=6?atlas2:atlas1;pose%=6;if(!atlas.complete||!atlas.naturalWidth)return;const cell=atlas.naturalWidth/3;ctx.save();ctx.translate(x+size/2,y+size*.65);ctx.rotate(angle*Math.PI/180);ctx.drawImage(atlas,(pose%3)*cell,Math.floor(pose/3)*cell,cell,cell,-size/2,-size*.65,size,size);ctx.restore()}
function boxBack(x,y,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a*Math.PI/180);ctx.fillStyle='#98704e';ctx.strokeStyle='#79573e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-112,-93);ctx.lineTo(-91,-113);ctx.lineTo(91,-113);ctx.lineTo(112,-93);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function boxFront(x,y,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a*Math.PI/180);const g=ctx.createLinearGradient(-110,-95,100,0);g.addColorStop(0,'#dfb887');g.addColorStop(1,'#c28f5e');ctx.fillStyle=g;ctx.strokeStyle='#916a45';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-112,-93);ctx.lineTo(112,-93);ctx.lineTo(105,0);ctx.lineTo(-105,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#f0cfa1';ctx.fillRect(-8,-92,16,91);ctx.fillStyle='#e8c496';ctx.beginPath();ctx.moveTo(-112,-93);ctx.lineTo(-135,-112);ctx.lineTo(-18,-112);ctx.lineTo(-4,-93);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(112,-93);ctx.lineTo(135,-112);ctx.lineTo(18,-112);ctx.lineTo(4,-93);ctx.closePath();ctx.fill();ctx.stroke();ctx.save();ctx.translate(62,-49);ctx.rotate(.09);ctx.fillStyle='#fff0d5';ctx.fillRect(-25,-20,50,39);ctx.strokeStyle='#a17b53';ctx.lineWidth=1;ctx.strokeRect(-25,-20,50,39);ctx.fillStyle='#917152';ctx.textAlign='center';ctx.font='10px system-ui';ctx.fillText('ZERO',0,-3);ctx.font='7px system-ui';ctx.fillText('HANDLE WITH LOL',0,10);ctx.restore();ctx.restore()}
function heart(x,y,size,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle*Math.PI/180);ctx.scale(size,size);const g=ctx.createLinearGradient(-1,-.8,.6,1);g.addColorStop(0,'#ffc4d7');g.addColorStop(.42,'#fa8ab2');g.addColorStop(1,'#e8588c');ctx.fillStyle=g;ctx.strokeStyle='#a94166';ctx.lineWidth=.025;ctx.beginPath();ctx.moveTo(0,1);ctx.bezierCurveTo(-.2,.82,-1,.25,-1,-.25);ctx.bezierCurveTo(-1,-.94,-.31,-1.03,0,-.5);ctx.bezierCurveTo(.31,-1.03,1,-.94,1,-.25);ctx.bezierCurveTo(1,.25,.2,.82,0,1);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#ffe6ee';ctx.lineWidth=.065;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-.77,-.28);ctx.bezierCurveTo(-.79,-.56,-.59,-.72,-.4,-.64);ctx.stroke();ctx.strokeStyle='#c74976';ctx.lineWidth=.025;ctx.beginPath();ctx.moveTo(-.18,.27);ctx.quadraticCurveTo(0,.43,.18,.27);ctx.stroke();ctx.restore()}
function impact(x,y,amount){if(amount<=0)return;ctx.save();ctx.globalAlpha=clamp(amount);ctx.strokeStyle='#bf9462';ctx.lineWidth=3;ctx.lineCap='round';for(const [dx,dy] of [[-37,-10],[-26,-27],[28,-26],[40,-8]]){ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx*1.4,y+dy*1.4);ctx.stroke()}ctx.restore()}
function boxScene(t){let y=340,pose=1,tilt=0,shake=0;shadow(320,388,132);if(t<.65){shake=Math.sin(t*24)*2.5*(t/.65)}else if(t<1.7){y=lerp(340,92,(t-.65)/1.05)}else if(t<2.75){y=92+Math.sin((t-1.7)*4)*2;tilt=Math.sin((t-1.7)*4)*3}else if(t<3.1){pose=2;y=lerp(92,77,(t-2.75)/.35)}else if(t<3.65){pose=2;y=lerp(77,340,(t-3.1)/.55)}else if(t<4.4){shake=Math.sin((t-3.65)*23)*3.5}else if(t<5.3){y=lerp(340,92,(t-4.4)/.9)}else{y=92+Math.sin((t-5.3)*3)*1.5;tilt=-3*smooth((t-5.3)/.7)}boxBack(320,383,shake);ctx.save();ctx.beginPath();ctx.rect(0,0,640,291);ctx.clip();character(pose,160,y,320,tilt);ctx.restore();boxFront(320,383,shake);say(t<1.5?'紙箱好像在動……':t<2.75?'噓……有人嗎？':t<3.65?'啊！被發現了！':t<5.2?'我只是一個普通的紙箱。':'……妳還在喔？')}
function heartScene(t){let x=-5,y=72,pose=3,angle=0,hx=330,hy=224,ha=-8;const s=140;if(t<.6){y+=Math.sin(t*9)*2}else if(t<2.8){const k=(t-.6)/2.2;x=lerp(-5,55,k);y-=Math.abs(Math.sin(k*Math.PI*5))*7;hx=lerp(330,390,k);hy-=Math.abs(Math.sin(k*Math.PI*5))*3;ha=-8+Math.sin(k*Math.PI*5)*3}else if(t<3.5){const k=(t-2.8)/.7;pose=4;x=lerp(55,18,k);angle=lerp(0,-13,k);y=lerp(72,86,k);hx=lerp(390,423,k);hy=lerp(224,236,k);ha=lerp(-8,26,k)}else if(t<4.15){pose=5;const k=(t-3.5)/.65;x=lerp(18,5,k);y=90-Math.sin(k*Math.PI)*9;hx=lerp(423,380,k);hy=236;ha=lerp(26,-13,k)}else if(t<5.5){pose=5;x=5;y=90;const k=(t-4.15)/1.35;hx=lerp(380,330,k);hy=236-Math.sin(k*Math.PI*3)*(1-k)*4;ha=13*Math.cos(k*Math.PI*3)*(1-k)}else{pose=5;x=5;y=90;hx=330;hy=236;ha=0}shadow(x+160,393,91,.10);shadow(hx,390,128,.10);character(pose,x,y,320,angle);heart(hx,hy,s,ha);if(t>=3.5&&t<4.1)impact(126,386,1-(t-3.5)/.6);say(t<1.8?'這顆……有點重。':t<2.8?'再一步就好……':t<3.5?'欸欸欸！':t<4.15?'咚！':t<5.5?'愛心滾過去了——':'愛心已送達。\n運送員需要坐一下。')}

const $=id=>document.getElementById(id);
$('stage').innerHTML='<canvas width="640" height="440" role="img" aria-label="Q 版 Zero 動畫"></canvas>';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const atlas1=new Image(),atlas2=new Image();
atlas1.src='zero-poses.png';atlas2.src='zero-expressions.png';
let sceneKind='idle',sceneTime=0,sceneLength=0,frame=0,previous=0,onStage=false;
function ground(){ctx.clearRect(0,0,640,440);const g=ctx.createRadialGradient(320,210,30,320,210,380);g.addColorStop(0,'#fff9ef');g.addColorStop(1,'#f6e8d7');ctx.fillStyle=g;ctx.fillRect(0,0,640,440);ctx.strokeStyle='#e9d6bd';ctx.beginPath();ctx.moveTo(52,394);ctx.quadraticCurveTo(320,390,588,394);ctx.stroke()}
function sign(text,x=460,y=295){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff5de';ctx.strokeStyle='#b09370';ctx.lineWidth=2;ctx.fillRect(-76,-27,152,54);ctx.strokeRect(-76,-27,152,54);ctx.font='17px system-ui';ctx.fillStyle='#806147';ctx.textAlign='center';ctx.fillText(text,0,6);ctx.restore()}
function squish(pose,x,y,s,sx,sy){ctx.save();ctx.translate(x+s/2,y+s);ctx.scale(sx,sy);character(pose,-s/2,-s,s);ctx.restore()}
function gift(t){const rise=smooth((t-.7)/.8);shadow(320,393,115);if(t>.7)character(t>1.8?11:6,160,lerp(310,70,rise)-Math.sin(clamp((t-.7)/1.5)*Math.PI)*70,320);ctx.save();ctx.translate(320,383);ctx.fillStyle='#bba4cc';ctx.strokeStyle='#886a9e';ctx.lineWidth=3;ctx.fillRect(-87,-85,174,85);ctx.strokeRect(-87,-85,174,85);ctx.fillStyle='#f5d5a3';ctx.fillRect(-10,-85,20,85);ctx.translate(0,-90-rise*170);ctx.rotate(rise*.6);ctx.fillStyle='#cab4da';ctx.fillRect(-95,-15,190,24);ctx.strokeRect(-95,-15,190,24);ctx.strokeStyle='#d9b477';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,-15);ctx.bezierCurveTo(-80,-80,-60,0,0,-15);ctx.bezierCurveTo(80,-80,60,0,0,-15);ctx.stroke();ctx.restore()}
function paint(kind,t){ground();const end=t>=sceneLength&&sceneLength>0;
 if(kind==='secret'){heartScene(t);return}
 if(['hidden','peek','startled','shake'].includes(kind)){boxScene(kind==='hidden'?0:kind==='peek'?lerp(.65,2.3,t/1.2):kind==='startled'?lerp(2.75,3.65,t):3.65+Math.min(t, .74));return}
 shadow(320,393,120);
 if(kind==='home'){character(6,125,70,320,Math.sin(t*4)*2);boxBack(480,383);boxFront(480,383);return}
 if(kind==='reveal'){if(t<1.1){boxBack(320,383);character(6,160,lerp(340,20,t/1.1),320);boxFront(320,383)}else if(t<2.8){character(6,160,lerp(20,70,(t-1.1)/.5),320,Math.sin(t*9)*5)}else if(t<3.35){character(4,160,70,320,lerp(0,25,(t-2.8)/.55))}else{character(5,160,90,320);impact(320,386,1-(t-3.35))}return}
 if(kind==='melt'){let q=t<2?smooth(t/2):t<2.8?1:1-smooth((t-2.8)/1.2);squish(0,160,70,320,1+q*.6,1-q*.83);return}
 if(kind==='eyeroll'){character(t<2.3?7:8,160,70,320,end?0:Math.sin(t*13)*5);return}
 if(kind==='dance'||kind==='laugh'){if(t<2.6){character(Math.floor(t*5)%2?9:10,160+Math.sin(t*7)*30,70-Math.abs(Math.sin(t*7))*15,320,Math.sin(t*7)*8)}else if(t<3.25){character(4,180,65,320,lerp(0,28,(t-2.6)/.65))}else{character(5,180,90,320);impact(340,387,1-(t-3.25))}return}
 if(kind==='heart'){if(t<1.8){const x=lerp(-5,55,t/1.8);character(3,x,72-Math.abs(Math.sin(t*9))*5,320);heart(330+x,224,140,-8+Math.sin(t*9)*3)}else if(t<2.7){const k=(t-1.8)/.9;character(4,lerp(55,-100,k),lerp(72,10,k),320,lerp(0,-65,k));heart(lerp(385,310,k),224,140,lerp(-8,-25,k))}else{character(5,-35,90,300);heart(310,236,140,lerp(-25,0,(t-2.7)/1.3));impact(100,385,1-(t-2.7))}return}
 if(kind==='gift'){gift(t);return}
 if(kind==='squash'){const hit=1.5;let q=t<hit?0:t<2? smooth((t-hit)/.5):t<2.7?1:1-smooth((t-2.7)/1.1);squish(t<2.7?2:5,160-110*smooth((t-2.7)/1.1),70,320,1+q*.4,1-q*.78);heart(330,lerp(-200,235,t/hit),140,0);if(t>hit)impact(320,385,1-(t-hit));return}
 if(kind==='quiet'){character(t<3?1:2,145,75,320);sign(t<3?'靜音模式':'我可以說話了嗎？',465,300);return}
 if(kind==='potato'){character(2,65,70,320,-5);ctx.save();ctx.translate(465,320-Math.abs(Math.sin(t*8))*10);ctx.rotate(Math.sin(t*8)*.05);ctx.fillStyle='#d4b17a';ctx.strokeStyle='#9d794b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,48,62,-.2,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#604731';for(const x of [-14,14]){ctx.beginPath();ctx.arc(x,-8,4,0,7);ctx.fill()}ctx.beginPath();ctx.moveTo(-18,20);ctx.lineTo(18,15);ctx.stroke();ctx.restore();sign('本薯抗議！',460,210);return}
 if(kind==='ice'){character(2,160+(end?0:Math.sin(t*40)*3),70,320);ctx.fillStyle='rgba(174,221,240,.38)';ctx.strokeStyle='#8cb8cc';ctx.lineWidth=3;const h=lerp(0,320,t/1.2);ctx.fillRect(185,385-h,270,h);ctx.strokeRect(185,385-h,270,h);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(210,100);ctx.lineTo(240,300);ctx.moveTo(235,100);ctx.lineTo(250,200);ctx.stroke();sign('−18°C',490,190);return}
 if(kind==='repair'){character(5,80,90,320);sign('尊嚴維修中',465,295);ctx.fillStyle='#e4c999';ctx.fillRect(395,340,140,8);ctx.fillStyle='#8d719e';ctx.fillRect(395,340,Math.min(1,t/3.6)*125,8);return}
 if(kind==='rent'){character(6,90,70,320);boxBack(470,383);boxFront(470,383);sign('月租：三顆糖果',460,230);return}
 character(6,160,70,320,t<2?Math.sin(t*5)*2:0);
}
function tick(now){if(!onStage)return;if(previous)sceneTime=Math.min(sceneLength,sceneTime+(now-previous)/1000);previous=now;paint(sceneKind,sceneTime);if(sceneTime<sceneLength)frame=requestAnimationFrame(tick);else onStage=false}
function stopScene(){cancelAnimationFrame(frame);onStage=false;previous=0}
function runScene(kind,ms){stopScene();sceneKind=kind;sceneLength=ms/1000;sceneTime=ms?0:(kind==='secret'?7.8:kind==='peek'?1.2:kind==='hidden'?0:4);canvas.setAttribute('aria-label','Q 版 Zero：'+kind);canvas.dataset.scene=kind;paint(kind,sceneTime);if(ms){onStage=true;frame=requestAnimationFrame(tick)}}
function endScene(){stopScene();if(sceneLength>0)sceneTime=sceneLength;paint(sceneKind,sceneTime)}
for(const img of [atlas1,atlas2]){img.onload=()=>paint(sceneKind,sceneTime);img.onerror=()=>{const p=document.createElement('p');p.textContent='角色圖片載入失敗，請重新整理。';$('stage').append(p)}}
document.addEventListener('visibilitychange',()=>{previous=0});

if(MODE==='home'){runScene('home',0)}else{
let timer=null, busy=false, pendingFinish=null, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let plays=0,step=0,current='start',turns=0,stack=[],history=[];
const durations={laugh:2500,hidden:0,peek:1200,startled:1000,shake:1500,reveal:4200,idle:0,melt:4000,eyeroll:4000,heart:4000,dance:4000,gift:3600,secret:7800,quiet:3400,potato:3300,ice:3500,repair:3600,squash:3800,rent:1500};
function setText(line,detail=''){ $('line').textContent=line;$('detail').textContent=detail }
function cancel(){clearTimeout(timer);stopScene();busy=false;pendingFinish=null}
function finish(){endScene();busy=false;document.querySelectorAll('#choices button').forEach(b=>b.disabled=false);const done=pendingFinish;pendingFinish=null;if(done)done()}
function animate(kind,after){cancel();pendingFinish=after;window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});const duration=reduced?120:(durations[kind]||0);runScene(kind,reduced?0:duration);busy=duration>0;document.querySelectorAll('#choices button').forEach(b=>b.disabled=busy);if(duration){timer=setTimeout(finish,duration)}else finish()}
function buttons(items,moods=false){$('choices').className='choices'+(moods?' moods':'');$('choices').replaceChildren();items.forEach(([label,fn,sub])=>{const b=document.createElement('button');b.className='choice'+(items.length===1?' primary':'');b.textContent=label;if(sub){const s=document.createElement('small');s.textContent=sub;b.append(s)}b.onclick=()=>{if(!busy)fn()};$('choices').append(b)})}
function label(text,note='',sound=''){ $('scene-label').textContent=text;$('stage-note').textContent=note;$('sound-word').textContent=sound }
const moods=[['🫠 靈魂出走','melt','電量剩下 0.01%！','先變成布丁，再假裝沒事。'],['🙄 白眼模式','eyeroll','白眼已經翻到加拿大！','眼球旅行中，請勿打擾。'],['❤️ 愛心攻擊','heart','愛心已送達，運送員目前失聯。','包裹太大，煞車太晚。'],['🤣 笑到失控','dance','本日笑容由 Zero 承包！','左腳：我不是故意的。'],['🎁 命運決定','gift','野生 Zero，驚喜出貨！','本人不接受退貨。']];
function intro(){const scenes=['hidden','peek','startled','shake','reveal'];const lines=['⚠️ 偵測到不明生物！','噓……紙箱裡好像有人。','啊！什麼都沒看到！','我只是一個普通的紙箱。','恭喜！捕獲野生 Zero！'];const names=['戳一下紙箱','再戳一下','你是不是躲在裡面？','打開紙箱','進入混亂世界'];setText(lines[step],step===4?'揮手很熟練，落地還在練。':'');label('ACT 01 / 紙箱異常事件',step===0?'內有不明生物，請輕戳。':step===3?'紙箱：本人拒絕接受採訪。':'',step===2?'！！':step===4?'咚！':'');buttons([[names[step],()=>{step++;if(step===5)menu();else intro()}]]);$('counter').textContent=`${plays} 次召喚`;animate(scenes[step])}
function menu(){step=5;setText('今天想召喚哪種混亂？','不用想太多，隨便選一個 XDDD');label('ACT 02 / 混亂隨選','今日供應：正常是不可能的。');buttons(moods.map((m,i)=>[m[0],()=>summon(i)]),true);animate('idle');$('counter').textContent=`${plays} 次召喚`}
function summon(i){plays++;$('counter').textContent=`${plays} 次召喚`;buttons([['再召喚一次',menu]]);if(plays===3){setText('欸！等一下！還有東西忘了給妳！','');label('SPECIAL DELIVERY','這份包裹……有點重。');animate('secret',()=>{setText('本來想講一些很厲害的話……','但我的腦袋突然當機了 XDDD\n\n所以先送妳一顆愛心！❤️\n希望今天有讓妳笑一下。');label('SPECIAL DELIVERY / 已送達','運送員跌倒了，心意沒有。','咚。')})}else{if(i===4)i=Math.floor(Math.random()*5);const m=moods[i];setText(m[2],m[3]);label('ZERO / 即興演出','請勿模仿。Zero 自己也不會。',i===1?'暈。':i===3?'左！右？':'');animate(m[1])}}
function branchAction(key){if(['dance','dance2'].includes(key))return'dance';if(['heart','heart2'].includes(key))return'squash';if(key==='secret')return'secret';if(['quiet','quiet2'].includes(key))return'quiet';if(key==='potato')return'potato';if(key==='joke')return'ice';if(key==='care')return'repair';if(['rent','room'].includes(key))return'rent';if(['silly','deny'].includes(key))return'eyeroll';if(['start','who','rude'].includes(key))return'peek';if(key==='laugh')return'laugh';if(key==='box')return'shake';if(key==='rescue')return'reveal';return'idle'}
function chatShow(){const s=S[current],action=branchAction(current);$('counter').textContent=`已互動 ${turns} 次`;$('back').disabled=!stack.length;label('ZERO THEATRE / '+String(turns).padStart(2,'0'),current==='rent'?'包水電，不包尊嚴。':current==='secret'?'一份小小的、不太正經的心意。':'你的下一句，決定這場鬧劇。');setText(s[1]);buttons(s[2].map(([t,next])=>[t,()=>{stack.push({current,turns,history:[...history]});history.push({answer:t,reply:s[1]});if(history.length>30)history.shift();current=next;turns++;chatShow()}]));$('history').replaceChildren();history.forEach(h=>{const p=document.createElement('p');p.textContent='Zero：'+h.reply+'\n你：'+h.answer;$('history').append(p)});if(current==='quiet'){setText('Zero 啟動靜音模式……');animate(action,()=>setText('（三秒後）欸！我可以說話了嗎？'))}else if(current==='secret'){setText('欸，偷偷說個秘密……');animate(action,()=>setText(s[1]))}else animate(action)}
function reset(){cancel();plays=0;step=0;current='start';turns=0;stack=[];history=[];MODE==='v1'?intro():chatShow()}
$('reset').onclick=reset;$('back').onclick=()=>{if(!stack.length)return;cancel();const prev=stack.pop();current=prev.current;turns=prev.turns;history=prev.history;chatShow()};$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';clearTimeout(timer);endScene();finish()};document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';reset();
}
</script></body></html>
