<!doctype html><html lang="zh-Hant"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不明生物出沒！</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#4c3444;background:#fff7f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.app{width:min(100%,430px);background:#fffdfb;border:2px solid #f4d6dc;border-radius:28px;padding:22px;box-shadow:0 15px 50px #ad74852a;text-align:center}h1{font-size:25px;margin:8px 0}p{line-height:1.6}.sub{font-size:13px;color:#9b7886}.stage{height:300px;background:radial-gradient(circle at 50% 40%,#fff9d8,#ffe8e9);border-radius:23px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:17px 0}.scene{position:relative;width:240px;height:260px;display:flex;justify-content:center;align-items:center}.person{position:absolute;top:27px;width:178px;height:205px;transform-origin:50% 80%;animation:bob 1.7s ease-in-out infinite}.hair{position:absolute;top:7px;left:22px;width:135px;height:120px;background:#302b32;border-radius:46% 48% 38% 40%;box-shadow:-18px 5px 0 -4px #302b32,17px 0 0 -5px #302b32}.curl{position:absolute;background:#302b32;border-radius:50%;width:49px;height:49px;top:-7px;left:16px;box-shadow:30px -10px #302b32,67px -7px #302b32,100px 5px #302b32}.face{position:absolute;top:46px;left:24px;width:132px;height:124px;background:#efbd9c;border:3px solid #6b4d48;border-radius:43% 43% 49% 49%}.glasses{position:absolute;top:42px;left:9px;width:51px;height:39px;border:5px solid #27252b;border-radius:42%;box-shadow:59px 0 0 -0px transparent}.glasses:after{content:'';position:absolute;left:57px;top:-5px;width:51px;height:39px;border:5px solid #27252b;border-radius:42%}.bridge{position:absolute;left:57px;top:51px;width:18px;border-top:4px solid #27252b}.eye{position:absolute;top:55px;width:9px;height:11px;background:#2b252a;border-radius:50%}.eye.l{left:32px}.eye.r{right:30px}.cheek{position:absolute;top:81px;width:22px;height:11px;background:#ec8f9a66;border-radius:50%}.cheek.l{left:11px}.cheek.r{right:11px}.mouth{position:absolute;top:83px;left:55px;width:24px;height:13px;border-bottom:4px solid #994e58;border-radius:50%}.shirt{position:absolute;top:161px;left:26px;width:129px;height:78px;background:#77a7c0;border:3px solid #526b82;border-radius:45% 45% 12% 12%}.arm{position:absolute;top:172px;width:40px;height:20px;background:#efbd9c;border:2px solid #a77563;border-radius:20px}.arm.l{left:1px;transform:rotate(24deg)}.arm.r{right:1px;transform:rotate(-24deg)}.boxfront{position:absolute;bottom:4px;left:8px;width:224px;height:119px;background:#d5a06b;border:4px solid #a96e43;border-radius:9px;z-index:3;box-shadow:inset 0 12px #edbb84}.boxfront:before{content:'📦';position:absolute;top:34px;left:85px;font-size:37px}.hidden .person{transform:translateY(135px)}.peek .person{transform:translateY(84px)}.caught .person{animation:shake .25s 3;transform:translateY(55px)}.escape .boxfront{animation:shake .35s infinite}.reveal .boxfront,.mood .boxfront{display:none}.reveal .person{animation:jump .8s ease-in-out infinite}.mood .person{animation:bob 1.3s infinite}.mood[data-kind='0'] .person{animation:melt 2.2s infinite}.mood[data-kind='1'] .person{animation:spin 1.6s infinite}.mood[data-kind='2'] .person{animation:heartjump 1.5s infinite}.mood[data-kind='3'] .person{animation:dance .55s infinite alternate}.mood[data-kind='4'] .person{animation:jump .7s infinite}.heart{display:none;position:absolute;font-size:90px;z-index:5;top:92px;animation:heartbeat .8s infinite}.mood[data-kind='2'] .heart,.surprise .heart{display:block}.surprise .person{animation:heartjump 1.3s infinite}.surprise .boxfront{display:none}.spark{position:absolute;font-size:30px;right:8px;top:12px;animation:twinkle 1s infinite}.moodButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.moodButtons button:last-child{grid-column:span 2}button{border:0;border-radius:16px;padding:14px 12px;font-size:16px;font-weight:700;color:#653d52;background:#ffe0e8;cursor:pointer;transition:transform .15s}button:active{transform:scale(.95)}button.primary{width:100%;background:#e983a6;color:white}.result{font-size:19px;font-weight:750;min-height:50px}.footer{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#a48b94;margin-top:18px}.reset{font-size:12px;background:none;padding:6px;color:#9b6a82}.tiny{font-size:12px;color:#aa8994}.hide{display:none!important}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes jump{50%{transform:translateY(-40px) rotate(-8deg)}}@keyframes shake{25%{transform:translateX(-9px) rotate(-5deg)}75%{transform:translateX(9px) rotate(5deg)}}@keyframes spin{50%{transform:rotate(16deg)}80%{transform:rotate(-14deg)}}@keyframes melt{50%{transform:scale(1.3,.38) translateY(85px)}}@keyframes heartjump{50%{transform:translateY(-22px) scale(1.07)}}@keyframes dance{from{transform:rotate(-15deg) translateX(-14px)}to{transform:rotate(15deg) translateX(14px)}}@keyframes heartbeat{50%{transform:scale(1.24)}}@keyframes twinkle{50%{opacity:.25;transform:rotate(40deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style></head><body><main class="app"><div class="sub">ZERO'S NONSENSE WORLD</div><h1 id="title">⚠️ 不明生物出沒！</h1><p class="sub" id="desc">據說這隻生物沒什麼用，但很會製造混亂……</p><div class="stage"><div id="scene" class="scene hidden"><div class="person"><div class="hair"></div><div class="curl"></div><div class="shirt"></div><div class="arm l"></div><div class="arm r"></div><div class="face"><div class="glasses"></div><div class="bridge"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div></div></div><div class="boxfront"></div><div class="heart">💗</div><div class="spark">✨</div></div></div><div id="result" class="result">紙箱好像在動……？ 📦</div><div id="controls"></div><div class="footer"><span id="count">試玩版 1.0 · 0 次召喚</span><button class="reset" onclick="reset()">↻ 重新開始</button></div></main><script>let step=0,plays=0;const scene=document.getElementById('scene'),controls=document.getElementById('controls'),result=document.getElementById('result'),title=document.getElementById('title'),desc=document.getElementById('desc'),count=document.getElementById('count');const moods=[['🫠 靈魂出走','電量剩下 0.01%！','Zero 直接融化成一灘布丁……'],['🙄 白眼模式','白眼已經翻到加拿大！','Zero 翻白眼翻到頭暈！'],['❤️ 愛心攻擊','小心！愛心超載！','Zero 被自己的愛心撞飛！'],['🤣 笑到失控','本日笑容由 Zero 承包！','Zero 跳怪舞，差點跌倒！'],['🎁 命運決定','恭喜獲得野生 Zero 一隻！','Zero 從禮物盒彈出來！']];function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.className='primary';b.onclick=fn;controls.appendChild(b)}function render(){controls.innerHTML='';count.textContent=`試玩版 1.0 · ${plays} 次召喚`;if(step<5){const names=['⚠️ 不明生物出沒！','📦 紙箱異常事件','😱 被抓包！','📦 紙箱開始逃跑','🎉 捕獲野生 Zero！'];const lines=['紙箱好像在動……？ 📦','等等！有人在偷看！👀','啊啊啊！被發現了！！','妳看不到我……妳看不到我……','恭喜捕獲一隻野生 Zero！'];const buttons=['戳一下紙箱 👆','再戳一下 XDDD','抓到妳了！','打開紙箱！','進入混亂世界 🎮'];title.textContent=names[step];desc.textContent='據說這隻生物沒有什麼用，但很會製造混亂……';result.textContent=lines[step];scene.className='scene '+['hidden','peek','caught','escape','reveal'][step];btn(buttons[step],()=>{step++;render()})}else if(step===5){title.textContent='今天想召喚哪種混亂？';desc.textContent='不用想太多，隨便選一個 XDDD';result.textContent='請選擇一種混亂 👇';scene.className='scene reveal';let wrap=document.createElement('div');wrap.className='moodButtons';moods.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m[0];b.onclick=()=>summon(i===4?Math.floor(Math.random()*4):i);wrap.appendChild(b)});controls.appendChild(wrap)}else if(step===6){btn('再召喚一次 🎲',()=>{step=5;render()})}else if(step===7){btn('再召喚一次 😂',()=>{step=5;render()})}}function summon(i){plays++;count.textContent=`試玩版 1.0 · ${plays} 次召喚`;if(plays===3){step=7;title.textContent='❤️ 發現隱藏彩蛋！';desc.textContent='SECRET UNLOCKED';scene.className='scene surprise';result.innerHTML='欸！等一下！<p style="font-size:16px;font-weight:400">本來想講一些很厲害的話……<br>但腦袋突然當機了 XDDD<br>所以先送妳一顆愛心！❤️<br><br>希望今天有讓妳笑一下。</p>'}else{step=6;title.textContent='召喚成功！';desc.textContent=moods[i][2];scene.className='scene mood';scene.dataset.kind=i;result.textContent=moods[i][1]}controls.innerHTML='';render()}function reset(){step=0;plays=0;render()}render();</script></body></html>
