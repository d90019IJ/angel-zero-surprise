const scene=$('scene');
if(MODE==='home'){scene.setAttribute('class','scene home')}else{
let timer=null, busy=false, pendingFinish=null, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let plays=0,step=0,current='start',turns=0,stack=[],history=[];
const durations={hidden:0,peek:1200,startled:1000,shake:1500,reveal:3600,idle:0,melt:4000,eyeroll:4000,heart:4000,dance:4000,gift:3600,secret:5500,quiet:3000,potato:3300,ice:3500,repair:3600,squash:3800,rent:1500};
function setText(line,detail=''){ $('line').textContent=line;$('detail').textContent=detail }
function cancel(){clearTimeout(timer);busy=false;pendingFinish=null}
function finish(){busy=false;document.querySelectorAll('#choices button').forEach(b=>b.disabled=false);const done=pendingFinish;pendingFinish=null;if(done)done()}
function animate(kind,after){cancel();pendingFinish=after;window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});scene.setAttribute('class','scene');void scene.getBoundingClientRect();scene.setAttribute('class','scene '+kind);const duration=reduced?120:(durations[kind]||0);busy=duration>0;document.querySelectorAll('#choices button').forEach(b=>b.disabled=busy);if(duration){timer=setTimeout(finish,duration)}else finish()}
function buttons(items,moods=false){$('choices').className='choices'+(moods?' moods':'');$('choices').replaceChildren();items.forEach(([label,fn,sub])=>{const b=document.createElement('button');b.className='choice'+(items.length===1?' primary':'');b.textContent=label;if(sub){const s=document.createElement('small');s.textContent=sub;b.append(s)}b.onclick=()=>{if(!busy)fn()};$('choices').append(b)})}
function label(text,note='',sound=''){ $('scene-label').textContent=text;$('stage-note').textContent=note;$('sound-word').textContent=sound }
const moods=[['🫠 靈魂出走','melt','電量剩下 0.01%！','先變成布丁，再假裝沒事。'],['🙄 白眼模式','eyeroll','白眼已經翻到加拿大！','眼球旅行中，請勿打擾。'],['❤️ 愛心攻擊','heart','愛心已送達，運送員目前失聯。','包裹太大，煞車太晚。'],['🤣 笑到失控','dance','本日笑容由 Zero 承包！','左腳：我不是故意的。'],['🎁 命運決定','gift','野生 Zero，驚喜出貨！','本人不接受退貨。']];
function intro(){const scenes=['hidden','peek','startled','shake','reveal'];const lines=['⚠️ 偵測到不明生物！','噓……紙箱裡好像有人。','啊！什麼都沒看到！','我只是一個普通的紙箱。','恭喜！捕獲野生 Zero！'];const names=['戳一下紙箱','再戳一下','你是不是躲在裡面？','打開紙箱','進入混亂世界'];setText(lines[step],step===4?'揮手很熟練，落地還在練。':'');label('ACT 01 / 紙箱異常事件',step===0?'內有不明生物，請輕戳。':step===3?'紙箱：本人拒絕接受採訪。':'',step===2?'！！':step===4?'咚！':'');buttons([[names[step],()=>{step++;if(step===5)menu();else intro()}]]);$('counter').textContent=`${plays} 次召喚`;animate(scenes[step])}
function menu(){step=5;setText('今天想召喚哪種混亂？','不用想太多，隨便選一個 XDDD');label('ACT 02 / 混亂隨選','今日供應：正常是不可能的。');buttons(moods.map((m,i)=>[m[0],()=>summon(i)]),true);animate('idle');$('counter').textContent=`${plays} 次召喚`}
function summon(i){plays++;$('counter').textContent=`${plays} 次召喚`;buttons([['再召喚一次',menu]]);if(plays===3){setText('欸！等一下！還有東西忘了給妳！','');label('SPECIAL DELIVERY','這份包裹……有點重。');animate('secret',()=>{setText('本來想講一些很厲害的話……','但我的腦袋突然當機了 XDDD\n\n所以先送妳一顆愛心！❤️\n希望今天有讓妳笑一下。');label('SPECIAL DELIVERY / 已送達','運送員跌倒了，心意沒有。','咚。')})}else{if(i===4)i=Math.floor(Math.random()*5);const m=moods[i];setText(m[2],m[3]);label('ZERO / 即興演出','請勿模仿。Zero 自己也不會。',i===1?'暈。':i===3?'左！右？':'');animate(m[1])}}
function branchAction(key){if(['dance','dance2'].includes(key))return'dance';if(['heart','heart2'].includes(key))return'squash';if(key==='secret')return'secret';if(['quiet','quiet2'].includes(key))return'quiet';if(key==='potato')return'potato';if(key==='joke')return'ice';if(key==='care')return'repair';if(['rent','room'].includes(key))return'rent';if(['silly','deny'].includes(key))return'eyeroll';if(key==='start')return'peek';if(key==='box')return'shake';if(key==='rescue')return'reveal';return'idle'}
function chatShow(){const s=S[current],action=branchAction(current);$('counter').textContent=`已互動 ${turns} 次`;$('back').disabled=!stack.length;label('ZERO THEATRE / '+String(turns).padStart(2,'0'),current==='rent'?'包水電，不包尊嚴。':current==='secret'?'一份小小的、不太正經的心意。':'你的下一句，決定這場鬧劇。');setText(s[1]);buttons(s[2].map(([t,next])=>[t,()=>{stack.push({current,turns,history:[...history]});history.push({answer:t,reply:s[1]});current=next;turns++;chatShow()}]));$('history').replaceChildren();history.forEach(h=>{const p=document.createElement('p');p.textContent='Zero：'+h.reply+'\n你：'+h.answer;$('history').append(p)});if(current==='quiet'){setText('Zero 啟動靜音模式……');animate(action,()=>setText('（三秒後）欸！我可以說話了嗎？'))}else if(current==='secret'){setText('欸，偷偷說個秘密……');animate(action,()=>setText(s[1]))}else animate(action)}
function reset(){cancel();plays=0;step=0;current='start';turns=0;stack=[];history=[];MODE==='v1'?intro():chatShow()}
$('reset').onclick=reset;$('back').onclick=()=>{if(!stack.length)return;cancel();const prev=stack.pop();current=prev.current;turns=prev.turns;history=prev.history;chatShow()};$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';clearTimeout(timer);finish()};document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';reset();
}
