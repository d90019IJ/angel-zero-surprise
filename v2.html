<!doctype html><html lang="zh-Hant"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero 的奇怪聊天室 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#fff1e9,#ffe9f2 55%,#e9f1ff);color:#50394a;font-family:system-ui,'Noto Sans TC',sans-serif;min-height:100vh;padding:15px;display:flex;justify-content:center}.app{width:min(100%,460px);background:#fffcfb;border:2px solid #f2d7e1;border-radius:25px;box-shadow:0 15px 50px #b883a329;padding:17px;align-self:flex-start}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h1{font-size:19px;margin:0}.muted{color:#a08091;font-size:12px}.reset{border:1px solid #eacbd7;background:white;border-radius:20px;padding:8px 12px;color:#835b72;cursor:pointer}.avatar-stage{height:170px;border-radius:20px;background:radial-gradient(circle,#fff8d9,#ffe5ed);display:grid;place-items:center;margin:14px 0;overflow:hidden;position:relative}.avatar{position:relative;width:125px;height:138px;animation:bounce 1.8s ease-in-out infinite}.hair{position:absolute;left:10px;top:6px;width:105px;height:100px;background:#302936;border-radius:45%;box-shadow:-12px 9px 0 -2px #302936,12px 5px 0 -2px #302936}.hair:before{content:' ';position:absolute;top:-7px;left:7px;width:34px;height:33px;border-radius:50%;background:#302936;box-shadow:26px -7px #302936,55px -3px #302936,75px 8px #302936}.face{position:absolute;top:39px;left:15px;width:96px;height:91px;border-radius:44% 44% 48% 48%;background:#efb997;border:3px solid #76554d}.eyes{position:absolute;top:28px;left:9px;display:flex;gap:7px}.lens{width:36px;height:30px;border:4px solid #28252d;border-radius:43%;display:grid;place-items:center;font-size:17px;background:#ffffff22}.mouth{position:absolute;top:61px;left:38px;width:19px;height:11px;border-bottom:4px solid #7d3c46;border-radius:50%}.shirt{position:absolute;top:119px;left:18px;width:90px;height:40px;background:#77a7b7;border-radius:35px 35px 0 0}.float{position:absolute;right:20px;top:20px;font-size:36px;animation:float 2s ease-in-out infinite}.avatar-stage.silly .avatar{animation:wiggle .35s infinite alternate}.avatar-stage.heart .float{font-size:55px}.avatar-stage.quiet .avatar{animation:none}.avatar-stage.surprise .avatar{animation:jump .8s infinite}.chat{background:#fff7f7;border-radius:17px;padding:13px;height:250px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:90%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap}.zero{align-self:flex-start;background:#fff;border:1px solid #f0dce4;border-bottom-left-radius:4px}.angel{align-self:flex-end;background:#dff4e9;border-bottom-right-radius:4px}.choices{display:grid;gap:9px;margin-top:14px}.choices button{border:1.5px solid #edcbd8;background:#fff;border-radius:13px;padding:13px 12px;font-size:15px;color:#66455c;cursor:pointer;text-align:left}.choices button:active{background:#ffe8f1;transform:scale(.99)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.foot button{border:0;background:none;color:#9b6784;cursor:pointer}.tag{font-size:11px;color:#a17b8e}.hint{font-size:12px;text-align:center;color:#9e778d;margin:10px 0 0}@keyframes bounce{50%{transform:translateY(-7px)}}@keyframes wiggle{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes jump{50%{transform:translateY(-24px) rotate(8deg)}}@keyframes float{50%{transform:translateY(-15px) rotate(12deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style></head><body><main class="app"><div class="head"><div><h1>📦 Zero 的奇怪聊天室</h1><div class="muted">2.0｜一場毫無意義但很熱鬧的對話</div></div><button class="reset" id="reset">↻ 重玩</button></div><div class="avatar-stage" id="stage"><div class="avatar"><div class="shirt"></div><div class="hair"></div><div class="face"><div class="eyes"><div class="lens">•</div><div class="lens">•</div></div><div class="mouth"></div></div></div><div class="float" id="float">📦</div></div><div class="chat" id="chat" aria-live="polite"></div><div class="choices" id="choices"></div><div class="foot"><span class="tag" id="count">已互動 0 次</span><button id="back">← 上一步</button></div><p class="hint">點不同選項，Zero 會有不同的奇怪反應 🤣</p></main><script>
const S={
start:['📦','喂喂喂！有人嗎？我被困在紙箱裡了！！',[['你哪位啊？😂','who'],['關我什麼事 XDD','rude'],['要不要救你？','rescue']]],
who:['🤓','我是 Zero，職業是……嗯……目前是紙箱住戶。',[['你是不是有病 XDDD','silly'],['那你房租多少？','rent'],['所以你在這幹嘛？','purpose']]],
rude:['🥹','嗚嗚，現在連紙箱裡的生物都沒有人權了嗎！',[['好啦，救你啦','rescue'],['你先表演一下','dance'],['我先笑一下哈哈哈','laugh']]],
rescue:['🥳','謝謝恩人！我決定以身相許……啊不是！以搞笑相報！',[['那你表演看看','dance'],['先送我愛心','heart'],['你可以安靜嗎？','quiet']]],
silly:['🙄','醫生說我很正常，只是醫生是我自己扮的。',[['你真的很鬧耶','laugh'],['再說一個笑話','joke'],['送我愛心啦','heart']]],
rent:['📦','一個月三顆糖果，包水電但不包尊嚴。',[['這麼便宜我也要住','room'],['那你有室友嗎？','room'],['你先出來啦','rescue']]],
purpose:['🤔','我正在執行一項極度機密的任務……讓某個人笑一下。噓！',[['誰啊？','secret'],['那你成功了嗎？','laugh'],['先表演看看','dance']]],
dance:['🪩','Zero 開始跳舞……左腳絆到右腳，整隻摔成一顆麻糬。',[['哈哈哈哈再一次','dance2'],['你還好嗎？😂','care'],['給你一顆愛心','heart']]],
dance2:['😵‍💫','第二次更慘，這次連紙箱都笑到翻過去了。',[['好啦別跳了','care'],['給我看彩蛋','secret'],['我要愛心','heart']]],
laugh:['🥹','等等……妳剛剛是不是笑了？我有證人喔！證人就是那個紙箱！',[['紙箱會說話？','box'],['沒有！我才沒笑','deny'],['好啦有一點😂','secret']]],
box:['📦','紙箱：本人拒絕接受採訪，謝謝。',[['你們兩個都很怪','joke'],['我投降了','secret'],['送愛心吧','heart']]],
deny:['😏','好喔，那剛剛嘴角上揚的是誰？隔壁的馬鈴薯嗎？',[['對啦是馬鈴薯','potato'],['好啦我笑了','secret'],['再表演一次','dance']]],
potato:['🥔','馬鈴薯已提出抗議：請勿冒用本薯身分。',[['哈哈哈哈','secret'],['馬鈴薯也要愛心','heart'],['回去找 Zero','start']]],
quiet:['🤐','Zero 啟動靜音模式……（三秒後）欸！我可以說話了嗎？',[['不行 XDDD','quiet2'],['可以啦','purpose'],['先給愛心','heart']]],
quiet2:['🥲','Zero 默默舉起牌子：「我只是想讓妳笑一下。」',[['好啦你贏了','secret'],['抱一個','heart'],['回到紙箱','start']]],
room:['🏠','歡迎入住！不過本紙箱只有 0.5 坪，請自行摺疊。',[['我不要了😂','laugh'],['你自己住啦','purpose'],['房東送愛心','heart']]],
care:['🥹','沒事沒事！我的尊嚴已經先送去維修了。',[['哈哈你真的很鬧','laugh'],['送你愛心','heart'],['你到底想幹嘛','purpose']]],
joke:['🧊','我本來想講個冷笑話……結果冷到連冰箱都叫我出去。',[['好冷喔！','laugh'],['再來一個','potato'],['我想看秘密','secret']]],
heart:['❤️','Zero 搬出巨大愛心，結果被壓成扁扁的麻糬。「這顆送妳啦！」',[['收下❤️','secret'],['再給我一顆','heart2'],['你先爬起來啦','care']]],
heart2:['💝','第二顆愛心太大，直接把紙箱撞到外太空。',[['救命哈哈哈','laugh'],['我收下啦','secret'],['重新玩','start']]],
secret:['💗','欸，偷偷說個秘密……\n這個小小的奇怪世界，是有人特別準備的。\n希望今天至少有一瞬間，妳覺得有趣。❤️',[['再來亂一次 XDDD','start'],['再收一顆愛心','heart']]]};
let current='start', turns=0, stack=[];const chat=document.getElementById('chat'),choices=document.getElementById('choices'),float=document.getElementById('float'),stage=document.getElementById('stage');function bubble(t,who){const el=document.createElement('div');el.className='bubble '+who;el.textContent=t;chat.append(el);chat.scrollTop=chat.scrollHeight}function show(){const s=S[current];float.textContent=s[0];stage.className='avatar-stage '+(current.includes('heart')?'heart':current==='quiet'?'quiet':current==='secret'?'surprise':['dance','dance2','silly','potato'].includes(current)?'silly':'');bubble(s[1],'zero');choices.replaceChildren();s[2].forEach(([label,next])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{stack.push({current,html:chat.innerHTML,turns});bubble(label,'angel');turns++;current=next;document.getElementById('count').textContent='已互動 '+turns+' 次';show()};choices.append(b)});document.getElementById('back').disabled=!stack.length}function reset(){current='start';turns=0;stack=[];chat.replaceChildren();document.getElementById('count').textContent='已互動 0 次';show()}document.getElementById('reset').onclick=reset;document.getElementById('back').onclick=()=>{if(!stack.length)return;const prev=stack.pop();current=prev.current;turns=prev.turns;chat.innerHTML=prev.html;const last=chat.lastElementChild;if(last&&last.classList.contains('zero'))last.remove();document.getElementById('count').textContent='已互動 '+turns+' 次';show()};reset();
</script></body></html>
