"😵‍💫","不服輸，再跳一次！……結果又捲成一條蛋餅。\n欸不是，我是 Zero 啦 XDDD",[["好啦別跳了","care"],["給我看彩蛋","secret"],["我要愛心","heart"]]],"laugh":["🥹","等等……妳剛剛是不是笑了？我有證人喔！證人就是那個紙箱！",[["紙箱會說話？","box"],["沒有！我才沒笑","deny"],["好啦有一點😂","secret"]]],"box":["📦","紙箱：本人拒絕接受採訪，謝謝。",[["你們兩個都很怪","joke"],["我投降了","secret"],["送愛心吧","heart"]]],"deny":["😏","好喔，那剛剛嘴角上揚的是誰？隔壁的馬鈴薯嗎？",[["對啦是馬鈴薯","potato"],["好啦我笑了","secret"],["再表演一次","dance"]]],"potato":["🥔","馬鈴薯已提出抗議：請勿冒用本薯身分。",[["哈哈哈哈","secret"],["馬鈴薯也要愛心","heart"],["回去找 Zero","start"]]],"quiet":["🤐","Zero 啟動靜音模式……（三秒後）欸！我可以說話了嗎？",[["不行 XDDD","quiet2"],["可以啦","purpose"],["先給愛心","heart"]]],"quiet2":["🥲","Zero 默默舉起牌子：「我只是想讓妳笑一下。」",[["好啦你贏了","secret"],["抱一個","heart"],["回到紙箱","start"]]],"room":["🏠","歡迎入住！不過本紙箱只有 0.5 坪，請自行摺疊。",[["我不要了😂","laugh"],["你自己住啦","purpose"],["房東送愛心","heart"]]],"care":["🥹","沒事沒事！我的尊嚴已經先送去維修了。",[["哈哈你真的很鬧","laugh"],["送你愛心","heart"],["你到底想幹嘛","purpose"]]],"joke":["🧊","我本來想講個冷笑話……結果冷到連冰箱都叫我出去。",[["好冷喔！","laugh"],["再來一個","potato"],["我想看秘密","secret"]]],"heart":["❤️","Zero 搬出巨大愛心，結果被壓成扁扁的麻糬。「這顆送妳啦！」",[["收下❤️","secret"],["再給我一顆","heart2"],["你先爬起來啦","care"]]],"heart2":["💝","第二顆愛心太大，直接把紙箱撞到外太空。",[["救命哈哈哈","laugh"],["我收下啦","secret"],["重新玩","start"]]],"secret":["💗","好啦，鬧夠了 XDDD\n\n這顆愛心先給妳～\n有讓妳笑一下，我就沒白摔了。\n\n下次無聊再來戳我，\n我應該還住在紙箱裡 XDDD",[["再來亂一次 XDDD","start"],["再收一顆愛心","heart"]]],"you":["point","妳呀",[["好啦，有笑了 XDDD","secret"],["那你再表演看看","dance"],["那愛心呢？","heart"]]]};

}

function boxScene(t){let y=340,pose=1,tilt=0,shake=0;shadow(320,388,132);if(t<.65){shake=Math.sin(t*24)*2.5*(t/.65)}else if(t<1.7){y=lerp(340,92,(t-.65)/1.05)}else if(t<2.75){y=92+Math.sin((t-1.7)*4)*2;tilt=Math.sin((t-1.7)*4)*3}else if(t<3.1){pose=2;y=lerp(92,77,(t-2.75)/.35)}else if(t<3.65){pose=2;y=lerp(77,340,(t-3.1)/.55)}else if(t<4.4){shake=Math.sin((t-3.65)*23)*3.5}else if(t<5.3){y=lerp(340,92,(t-4.4)/.9)}else{y=92+Math.sin((t-5.3)*3)*1.5;tilt=-3*smooth((t-5.3)/.7)}boxBack(320,383,shake);ctx.save();ctx.beginPath();ctx.rect(0,0,640,291);ctx.clip();character(pose,160,y,320,tilt);ctx.restore();boxFront(320,383,shake);say(t<1.5?'紙箱好像在動……':t<2.75?'噓……有人嗎？':t<3.65?'啊！被發現了！':t<5.2?'我只是一個普通的紙箱。':'……妳還在喔？')}

function tick(now){if(!onStage)return;if(previous)sceneTime=Math.min(sceneLength,sceneTime+(now-previous)/1000);previous=now;paint(sceneKind,sceneTime);if(sceneTime<sceneLength)frame=requestAnimationFrame(tick);else onStage=false}
function stopScene(){cancelAnimationFrame(frame);onStage=false;previous=0}
function runScene(kind,ms){stopScene();sceneKind=kind;sceneLength=ms/1000;sceneTime=ms?0:(kind==='secret'?7.8:kind==='peek'?1.2:kind==='hidden'?0:kind==='dance'?9:kind==='squash'?8.5:kind==='potato'?7:kind==='repair'?7:kind==='point'?7:4);canvas.setAttribute('aria-label','Q 版 Zero：'+kind);canvas.dataset.scene=kind;paint(kind,sceneTime);if(ms){onStage=true;frame=requestAnimationFrame(tick)}}
function endScene(){stopScene();if(sceneLength>0)sceneTime=sceneLength;paint(sceneKind,sceneTime)}
for(const img of [atlas1,atlas2,mochi,pout,roll,point,crouch,hands,mutedZero,signZero,doctorZero]){img.onload=()=>paint(sceneKind,sceneTime);img.onerror=()=>{const p=document.createElement('p');p.textContent='角色圖片載入失敗，請重新整理。';$('stage').append(p)}}

function buttons(items,moods=false){$('choices').className='choices'+(moods?' moods':'');$('choices').replaceChildren();items.forEach(([label,fn,sub])=>{const b=document.createElement('button');b.className='choice'+(items.length===1?' primary':'');b.textContent=label;if(sub){const s=document.createElement('small');s.textContent=sub;b.append(s)}b.onclick=()=>{if(!busy)fn()};$('choices').append(b)})}
function label(text,note='',sound=''){ $('scene-label').textContent=text;$('stage-note').textContent=note;$('sound-word').textContent=sound }
const moods=[['🫠 靈魂出走','melt','電量剩下 0.01%！','先變成布丁，再假裝沒事。'],['🙄 白眼模式','eyeroll','白眼已經翻到加拿大！','眼球旅行中，請勿打擾。'],['❤️ 愛心攻擊','heart','愛心已送達，運送員目前失聯。','包裹太大，煞車太晚。'],['🤣 笑到失控','dance','本日笑容由 Zero 承包！','左腳：我不是故意的。'],['🎁 命運決定','gift','野生 Zero，驚喜出貨！','本人不接受退貨。']];
function intro(){const scenes=['hidden','peek','startled','shake','reveal'];const lines=['⚠️ 偵測到不明生物！','噓……紙箱裡好像有人。','啊！什麼都沒看到！','我只是一個普通的紙箱。','恭喜！捕獲野生 Zero！'];const names=['戳一下紙箱','再戳一下','你是不是躲在裡面？','打開紙箱','進入混亂世界'];setText(lines[step],step===4?'揮手很熟練，落地還在練。':'');label('ACT 01 / 紙箱異常事件',step===0?'內有不明生物，請輕戳。':step===3?'紙箱：本人拒絕接受採訪。':'',step===2?'！！':step===4?'咚！':'');buttons([[names[step],()=>{step++;if(step===5)menu();else intro()}]]);$('counter').textContent=`${plays} 次召喚`;animate(scenes[step])}
function menu(){step=5;setText('今天想召喚哪種混亂？','不用想太多，隨便選一個 XDDD');label('ACT 02 / 混亂隨選','今日供應：正常是不可能的。');buttons(moods.map((m,i)=>[m[0],()=>summon(i)]),true);animate('idle');$('counter').textContent=`${plays} 次召喚`}
function summon(i){plays++;$('counter').textContent=`${plays} 次召喚`;buttons([['再召喚一次',menu]]);if(plays===3){setText('欸！等一下！還有東西忘了給妳！','');label('SPECIAL DELIVERY','這份包裹……有點重。');animate('secret',()=>{setText('本來想講一些很厲害的話……','但我的腦袋突然當機了 XDDD\n\n所以先送妳一顆愛心！❤️\n希望今天有讓妳笑一下。');label('SPECIAL DELIVERY / 已送達','運送員跌倒了，心意沒有。','咚。')})}else{if(i===4)i=Math.floor(Math.random()*5);const m=moods[i];setText(m[2],m[3]);label('ZERO / 即興演出','請勿模仿。Zero 自己也不會。',i===1?'暈。':i===3?'左！右？':'');animate(m[1])}}
function branchAction(key){if(key==='you')return'point';if(['dance','dance2'].includes(key))return'dance';if(['heart','heart2'].includes(key))return'squash';if(key==='secret')return'secret';if(key==='quiet')return'quiet';if(key==='quiet2')return'quiet-sign';if(key==='potato')return'potato';if(key==='joke')return'ice';if(key==='care')return'repair';if(['rent','room'].includes(key))return'rent';if(key==='silly')return'doctor';if(key==='deny')return'eyeroll';if(['start','who','rude'].includes(key))return'peek';if(key==='laugh')return'laugh';if(key==='box')return'shake';if(key==='rescue')return'reveal';return'idle'}
function chatShow(){dialogueKey=current;const s=S[current],action=branchAction(current);$('counter').textContent=`已互動 ${turns} 次`;$('back').disabled=!stack.length;label('ZERO THEATRE / '+String(turns).padStart(2,'0'),current==='rent'?'包水電，不包尊嚴。':current==='secret'?'一份小小的、不太正經的心意。':'你的下一句，決定這場鬧劇。');setText(s[1]);buttons(s[2].map(([t,next])=>[t,()=>{stack.push({current,turns,history:[...history]});history.push({answer:t,reply:s[1]});if(history.length>30)history.shift();current=next;turns++;chatShow()}]));$('history').replaceChildren();history.forEach(h=>{const p=document.createElement('p');p.textContent='Zero：'+h.reply+'\n你：'+h.answer;$('history').append(p)});if(current==='quiet'){setText('Zero 啟動靜音模式……');animate(action,()=>setText('（三秒後）欸！我可以說話了嗎？'))}else if(current==='secret'){setText('欸，偷偷說個秘密……');animate(action,()=>setText(s[1]))}else animate(action)}
function reset(){cancel();plays=0;step=0;current='start';turns=0;stack=[];history=[];MODE==='v1'?intro():chatShow()}
$('reset').onclick=reset;$('back').onclick=()=>{if(!stack.length)return;cancel();const prev=stack.pop();current=prev.current;turns=prev.turns;history=prev.history;chatShow()};$('motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';clearTimeout(timer);endScene();finish()};document.body.classList.toggle('reduced',reduced);$('motion').textContent=reduced?'開啟完整動態':'減少動態';reset();
}
</script></body></html>
